services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.dockhand.rule: Host(`hand.${DOMAIN}`)
      traefik.http.routers.dockhand.tls.certresolver: letsencrypt
      traefik.http.routers.dockhand.entrypoints: websecure
      traefik.http.services.dockhand.loadbalancer.server.port: 3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DATA_DIR}/dockhand:/app/data
      - ${DOCKER_COMPOSE_DIR}:/mnt/docker/compose
      - $HOME/.local/bin/pass-cli:/usr/local/bin/pass-cli
    networks:
      web:

networks:
  web:
    name: traefik_web
    external: true
