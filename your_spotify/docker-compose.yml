services:
  mongo:
    container_name: mongo
    image: mongo:latest
    ports:
      - 27017:27017
    volumes:
      - ${DOCKER_DATA_DIR}/spotify/db:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SPOTIFY_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${SPOTIFY_MONGO_PASS}
    networks:
      - web
    restart: unless-stopped

  spotify:
    image: lscr.io/linuxserver/your_spotify:latest
    container_name: spotify
    ports:
      - ${SPOTIFY_PORT}:80
      - ${SPOTIFY_HTTPS_PORT}:443
    depends_on:
      - mongo
    labels:
      traefik.enable: true
      traefik.http.routers.spotify.entrypoints: websecure
      traefik.http.routers.spotify.tls: true
      traefik.http.routers.spotify.tls.certresolver: letsencrypt
      traefik.http.services.spotify.loadbalancer.server.port: 80
    networks:
      - web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - APP_URL=https://spotify.${DOMAIN}
      - MONGO_ENDPOINT=mongodb://${SPOTIFY_MONGO_USER}:${SPOTIFY_MONGO_PASS}@mongo
      - SPOTIFY_PUBLIC=${SPOTIFY_PUBLIC_KEY}
      - SPOTIFY_SECRET=${SPOTIFY_PRIVATE_KEY}
      - CORS=all
    restart: unless-stopped

networks:
  web:
    name: traefik_web
    external: true
  spotify:
    name: spotify
