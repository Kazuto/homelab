services:
  postgres:
    image: postgres:16-alpine
    container_name: parlance-postgres
    environment:
      POSTGRES_DB: parlance
      POSTGRES_USER: parlance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - parlance
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parlance"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/minio
    container_name: parlance-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - parlance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/kazuto/parlance-api:develop
    container_name: parlance-api
    environment:
      ENV: production
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: parlance
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: parlance
      DB_SSL_MODE: disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: 24h
      CORS_ALLOWED_ORIGINS: https://parlance.${DOMAIN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET}
      S3_USE_SSL: "false"
    labels:
      traefik.enable: true
      traefik.docker.network: traefik_web
      traefik.http.routers.parlance-api.rule: Host(`parlance.${DOMAIN}`) && (PathPrefix(`/parlance.v1.`) || PathPrefix(`/avatars/`) || Path(`/health`))
      traefik.http.routers.parlance-api.entrypoints: websecure
      traefik.http.routers.parlance-api.tls: true
      traefik.http.routers.parlance-api.tls.certresolver: letsencrypt
      traefik.http.services.parlance-api.loadbalancer.server.port: 8080
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      web:
      parlance:
    restart: unless-stopped

  translator:
    container_name: parlance-translator
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    command:
      - -hf
      - ${TRANSLATOR_MODEL:-tencent/Hy-MT2-7B-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --parallel
      - "2"
      - --ctx-size
      - "8192"
      - -ngl
      - "99"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - translator_models:/root/.cache
    networks:
      parlance:
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # The first start downloads the model.
      start_period: 10m
    restart: unless-stopped

  frontend:
    image: ghcr.io/kazuto/parlance-frontend:develop
    container_name: parlance-frontend
    environment:
      NUXT_PUBLIC_API_BASE_URL: https://parlance.${DOMAIN}
    labels:
      traefik.enable: true
      traefik.docker.network: traefik_web
      traefik.http.routers.parlance.rule: Host(`parlance.${DOMAIN}`)
      traefik.http.routers.parlance.entrypoints: websecure
      traefik.http.routers.parlance.tls: true
      traefik.http.routers.parlance.tls.certresolver: letsencrypt
      traefik.http.services.parlance.loadbalancer.server.port: 3000
      homepage.group: Productivity
      homepage.name: Parlance
      homepage.icon: mdi-translate
      homepage.href: https://parlance.${DOMAIN}
    depends_on:
      - api
    networks:
      web:
      parlance:
    restart: unless-stopped

networks:
  web:
    name: traefik_web
    external: true
  parlance:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  translator_models:
