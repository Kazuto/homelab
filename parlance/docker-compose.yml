services:
  postgres:
    image: postgres:16-alpine
    container_name: parlance-postgres
    environment:
      POSTGRES_DB: parlance
      POSTGRES_USER: parlance
      POSTGRES_PASSWORD: ${PARLANCE_POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - parlance
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parlance"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/minio
    container_name: parlance-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PARLANCE_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${PARLANCE_MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - minio-data:/data
    networks:
      - parlance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/kazuto/parlance-api:develop
    container_name: parlance-api
    environment:
      ENV: production
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: parlance
      DB_PASSWORD: ${PARLANCE_POSTGRES_PASSWORD:-changeme}
      DB_NAME: parlance
      DB_SSL_MODE: disable
      JWT_SECRET: ${PARLANCE_JWT_SECRET}
      JWT_EXPIRY: 24h
      CORS_ALLOWED_ORIGINS: http://localhost:${PARLANCE_FRONTEND_PORT:-8521}
      DEEPL_API_KEY: ${PARLANCE_DEEPL_API_KEY:-}
      DEEPL_API_URL: https://api.deepl.com/v2
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${PARLANCE_MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${PARLANCE_MINIO_ROOT_PASSWORD:-changeme}
      S3_BUCKET: ${PARLANCE_MINIO_BUCKET:-parlance}
      S3_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${PARLANCE_API_PORT:-8520}:8080"
    networks:
      - parlance
    restart: unless-stopped

  frontend:
    image: ghcr.io/kazuto/parlance-frontend:develop
    container_name: parlance-frontend
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://api:8080
    labels:
      traefik.enable: true
      traefik.http.routers.parlance.entrypoints: websecure
      traefik.http.routers.parlance.tls: true
      traefik.http.routers.parlance.tls.certresolver: letsencrypt
      traefik.http.services.parlance.loadbalancer.server.port: 3000
      homepage.group: Productivity
      homepage.name: Parlance
      homepage.icon: mdi-translate
      homepage.href: https://parlance.${DOMAIN}
    depends_on:
      - api
    ports:
      - "${PARLANCE_FRONTEND_PORT:-8521}:3000"
    networks:
      web:
      parlance:
    restart: unless-stopped

networks:
  web:
    name: traefik_web
    external: true
  parlance:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
