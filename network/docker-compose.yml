services:
  traefik:
    image: traefik
    container_name: "traefik"
    labels:
      traefik.enable: true
      traefik.http.routers.traefik.entrypoints: web # Set the Traefik entry point.
      traefik.http.middlewares.https-redirect.redirectscheme.scheme: https
      traefik.http.routers.traefik.middlewares: https-redirect
      traefik.http.routers.traefik-secure.entrypoints: websecure
      traefik.http.routers.traefik-secure.tls: true
      traefik.http.routers.traefik-secure.tls.certresolver: letsencrypt
      traefik.http.routers.traefik-secure.tls.domains[0].main: ${DOMAIN}
      traefik.http.routers.traefik-secure.tls.domains[0].sans: "*.${DOMAIN}"
      traefik.http.routers.traefik-secure.service: api@internal # Enable Traefik API.
      homepage.group: Homelab
      homepage.name: Traefik
      homepage.icon: traefik.png
      homepage.widget.type: traefik
      homepage.widget.url: http://${LOCAL_IP}:${TRAEFIK_DASHBOARD_PORT}
    environment:
      - DOMAIN=${DOMAIN}
      - CF_API_EMAIL=${CF_API_EMAIL}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    ports:
      - ${TRAEFIK_HTTP_PORT}:80
      - ${TRAEFIK_HTTPS_PORT}:443
      - ${TRAEFIK_DASHBOARD_PORT}:8080
    volumes:
      - ${DOCKER_COMPOSE_DIR}/network/:/etc/traefik/
      - ${DOCKER_DATA_DIR}/letsencrypt/:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    networks:
      - web
    restart: unless-stopped

  adguard:
    image: adguard/adguardhome
    container_name: adguard
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.adguard.entrypoints: websecure
      traefik.http.routers.adguard.tls: true
      traefik.http.routers.adguard.tls.certresolver: letsencrypt
      traefik.http.services.adguard.loadbalancer.server.port: 80
      traefik.port: 80
    volumes:
      - ${DOCKER_DATA_DIR}/adguard/work:/opt/adguardhome/work
      - ${DOCKER_DATA_DIR}/adguard/conf:/opt/adguardhome/conf
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${ADGUARD_HTTP_PORT}:80/tcp"
      - "${ADGUARD_HTTPS_PORT}:3000/tcp"
    networks:
      - web

  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/diun/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Berlin
      - LOG_LEVEL=info
      - DIUN_WATCH_SCHEDULE=0 */6 * * * # Check every 6 hours
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_DISCORD_WEBHOOKURL=${DIUN_NOTIF_DISCORD_WEBHOOKURL}
    networks:
      - web

networks:
  web:
    name: traefik_web
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.90.0/24
