services:
  emby:
    image: emby/embyserver:4.8.8.0
    container_name: emby
    # network_mode: host # Enable DLNA and Wake-on-Lan
    ports:
      - ${EMBY_HTTP_PORT}:8096 # HTTP port
      - ${EMBY_HTTPS_PORT}:8920 # HTTPS port
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 16G
        reservations:
          cpus: "4"
          memory: 8G
          # devices:
          #   - driver: nvidia
          #     count: 1
          #     capabilities: [gpu]
    environment:
      GID: 992
      GIDLIST: 992
    labels:
      traefik.enable: true
      traefik.http.routers.emby.entrypoints: web
      traefik.http.routers.emby.middlewares: https-redirect
      traefik.http.routers.emby-secure.entrypoints: websecure
      traefik.http.services.emby.loadbalancer.server.port: 8096
      homepage.group: Media
      homepage.name: Emby
      homepage.icon: emby.png
      homepage.href: https://emby.${DOMAIN}
      homepage.widget.type: emby
      homepage.widget.key: ${EMBY_API_KEY}
      homepage.widget.url: http://${LOCAL_IP}:${EMBY_HTTP_PORT}
      homepage.widget.enableBlocks: true
    volumes:
      - ${DOCKER_DATA_DIR}/emby-4.8/config:/config
      # - ${DOCKER_DATA_DIR}/emby/themes:/system/dashboard-ui/modules/themes
      - /mnt/backup/services/emby:/mnt/backup # Backup directory
      - /mnt/media/movies:/mnt/movies # Media directory
      - /mnt/shows/shows:/mnt/shows # Media directory
      - /mnt/shows/anime:/mnt/anime # Media directory
      - /mnt/shows/audio_books:/mnt/audio_books # Media directory
    devices:
      - /dev/dri:/dev/dri # For H/W transcoding
    networks:
      - web
      - telegram
    restart: unless-stopped

  emby-telegram-notifier:
    container_name: emby-telegram-notifier
    image: fahmula/emby-telegram-notifier
    restart: unless-stopped
    depends_on:
      - emby
    ports:
      - "${TELEGRAM_BOT_PORT}:5000"
    environment:
      - EMBY_BASE_URL=http://${LOCAL_IP}:${EMBY_HTTP_PORT}
      - EMBY_API_KEY=${EMBY_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SEASON_ADDED_WITHIN_X_DAYS=3
      - EPISODE_PREMIERED_WITHIN_X_DAYS=365
    networks:
      - telegram

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    labels:
      traefik.enable: true
      traefik.http.routers.jellyfin.entrypoints: websecure
      traefik.http.routers.jellyfin.tls: true
      traefik.http.routers.jellyfin.tls.certresolver: letsencrypt
      traefik.http.services.jellyfin.loadbalancer.server.port: 8096
      traefik.http.middlewares.jellyfin-https-redirect.redirectscheme.scheme: https
      traefik.port: 8096
      homepage.group: Media
      homepage.name: Jellyfin
      homepage.icon: jellyfin.png
      homepage.href: https://jellyfin.${DOMAIN}
      homepage.widget.type: jellyfin
      homepage.widget.key: ${JELLYFIN_API_KEY}
      homepage.widget.url: http://${LOCAL_IP}:${JELLYFIN_HTTP_PORT}
      homepage.widget.enableBlocks: true
    ports:
      - ${JELLYFIN_HTTP_PORT}:8096 # HTTP port
      - ${JELLYFIN_HTTPS_PORT}:8920 # HTTPS port
    volumes:
      - ${DOCKER_DATA_DIR}/jellyfin/config:/config
      - ${DOCKER_DATA_DIR}/jellyfin/cache:/cache
      - /mnt/backup/services/jellyfin:/mnt/backup # Backup directory
      - /mnt/media/adult:/mnt/adult # Media directory
    restart: "unless-stopped"
    networks:
      - web

networks:
  web:
    name: traefik_web
    external: true
  telegram:
    name: telegram
