services:
  emby:
    image: emby/embyserver:4.10.0.40
    container_name: emby
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 16G
        reservations:
          cpus: "4"
          memory: 8G
          # devices:
          #   - driver: nvidia
          #     count: 1
          #     capabilities: [gpu]
    environment:
      GID: 992
      GIDLIST: 992
    labels:
      traefik.enable: true
      traefik.http.routers.emby.entrypoints: web
      traefik.http.routers.emby.middlewares: https-redirect
      traefik.http.routers.emby-secure.entrypoints: websecure
      traefik.http.services.emby.loadbalancer.server.port: 8096
      homepage.group: Media
      homepage.name: Emby
      homepage.icon: emby.png
      homepage.href: https://emby.${DOMAIN}
      homepage.widget.type: emby
      homepage.widget.key: ${EMBY_API_KEY}
      homepage.widget.url: http://emby:8096
      homepage.widget.enableBlocks: true
    volumes:
      - ${DOCKER_DATA_DIR}/emby-4.8/config:/config
      # - ${DOCKER_DATA_DIR}/emby/themes:/system/dashboard-ui/modules/themes
      - /mnt/backup/services/emby:/mnt/backup # Backup directory
      - /mnt/media:/mnt/media # Media directory
    devices:
      - /dev/dri:/dev/dri # For H/W transcoding
    networks:
      web:
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    labels:
      traefik.enable: true
      traefik.http.routers.jellyfin.entrypoints: websecure
      traefik.http.routers.jellyfin.tls: true
      traefik.http.routers.jellyfin.tls.certresolver: letsencrypt
      traefik.http.services.jellyfin.loadbalancer.server.port: 8096
      traefik.http.middlewares.jellyfin-https-redirect.redirectscheme.scheme: https
      homepage.group: Media
      homepage.name: Jellyfin
      homepage.icon: jellyfin.png
      homepage.href: https://jellyfin.${DOMAIN}
      homepage.widget.type: jellyfin
      homepage.widget.key: ${JELLYFIN_API_KEY}
      homepage.widget.url: http://jellyfin:8096
      homepage.widget.version: 2
      homepage.widget.enableBlocks: true
      homepage.widget.enableMediaControl: false
      homepage.widget.expandOneStreamToTwoRows: false
    user: ${PUID}:${PGID}
    group_add:
      - "992"
    volumes:
      - ${DOCKER_DATA_DIR}/jellyfin/config:/config
      - ${DOCKER_DATA_DIR}/jellyfin/cache:/cache
      - /mnt/backup/services/jellyfin:/mnt/backup # Backup directory
      - /mnt/media:/mnt/media # Media directory
      - /mnt/media/adult/:/mnt/adult # Adult directory
    devices:
      - /dev/dri:/dev/dri
    networks:
      web:
    restart: "unless-stopped"

  jellystat-db:
    image: postgres:15.2-alpine
    container_name: jellystat-db
    environment:
      POSTGRES_DB: jfstat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${JELLYSTAT_DB_PASSWORD}
    volumes:
      - ${DOCKER_DATA_DIR}/jellystat/db:/var/lib/postgresql/data
    networks:
      web:
    restart: unless-stopped

  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${JELLYSTAT_DB_PASSWORD}
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JELLYSTAT_JWT_SECRET}
    labels:
      traefik.enable: true
      traefik.http.routers.jellystat.entrypoints: websecure
      traefik.http.routers.jellystat.tls: true
      traefik.http.routers.jellystat.tls.certresolver: letsencrypt
      traefik.http.services.jellystat.loadbalancer.server.port: 3000
      homepage.group: Media
      homepage.name: Jellystat
      homepage.icon: jellystat.png
      homepage.href: https://jellystat.${DOMAIN}
      homepage.widget.type: jellystat
      homepage.widget.url: http://jellystat:3000
      homepage.widget.key: ${JELLYSTAT_API_KEY}
    volumes:
      - ${DOCKER_DATA_DIR}/jellystat/backup-data:/app/backend/backup-data
    networks:
      web:
    depends_on:
      - jellystat-db
    restart: unless-stopped

networks:
  web:
    name: traefik_web
    external: true
