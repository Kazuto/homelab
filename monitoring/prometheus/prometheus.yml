global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: speedtest
    scrape_interval: 30m   # align with SPEEDTEST_SCHEDULE; Prometheus triggers the actual test
    scrape_timeout: 120s
    static_configs:
      - targets: ["speedtest-exporter:9798"]
