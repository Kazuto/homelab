services:
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    labels:
      traefik.enable: true
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.tls: true
      traefik.http.routers.grafana.tls.certresolver: letsencrypt
      traefik.http.services.grafana.loadbalancer.server.port: 3000
      homepage.group: Monitoring
      homepage.name: Grafana
      homepage.icon: grafana.png
      homepage.href: https://grafana.${DOMAIN}
      homepage.widget.type: grafana
      homepage.widget.url: http://${LOCAL_IP}:${GRAFANA_PORT}
      homepage.widget.username: ${GRAFANA_ADMIN_USER}
      homepage.widget.password: ${GRAFANA_ADMIN_PASSWORD}
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
    ports:
      - ${GRAFANA_PORT}:3000
    volumes:
      - ${DOCKER_DATA_DIR}/grafana/data:/var/lib/grafana
    networks:
      - web
      - monitoring
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ${DOCKER_COMPOSE_DIR}/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${DOCKER_DATA_DIR}/loki/data:/loki
    networks:
      - monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ${DOCKER_COMPOSE_DIR}/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ${DOCKER_COMPOSE_DIR}/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DOCKER_DATA_DIR}/prometheus/data:/prometheus
    networks:
      - monitoring
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.netdev # network interface stats (bytes/s, packets/s)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring
    restart: unless-stopped

  speedtest-exporter:
    image: miguelndecarvalho/speedtest-exporter:latest
    container_name: speedtest-exporter
    environment:
      - SPEEDTEST_PORT=9798
      - SPEEDTEST_SCHEDULE=0 */6 * * * # Run every 6 hours
    networks:
      - monitoring
    restart: unless-stopped

networks:
  web:
    name: traefik_web
    external: true
  monitoring:
    name: monitoring
    driver: bridge
