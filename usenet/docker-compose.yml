    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      TZ: ${TZ:-UTC}
    labels:
      traefik.enable: true
      traefik.http.routers.seerr.entrypoints: websecure
      traefik.http.routers.seerr.tls: true
      traefik.http.routers.seerr.tls.certresolver: letsencrypt
      traefik.http.services.seerr.loadbalancer.server.port: 5055
      homepage.group: Downloads
      homepage.name: Seerr
      homepage.icon: Seerr.png
      homepage.href: https://seerr.${DOMAIN}
      homepage.widget.type: seerr
      homepage.widget.url: http://${LOCAL_IP}:${SEERR_PORT}
      homepage.widget.key: ${SEERR_API_KEY}
