services:
  actual:
    image: actualbudget/actual-server:latest
    container_name: actual
    labels:
      traefik.enable: true
      traefik.http.routers.actual-budget.entrypoints: websecure
      traefik.http.routers.actual-budget.tls: true
      traefik.http.routers.actual-budget.tls.certresolver: letsencrypt
      traefik.http.services.actual-budget.loadbalancer.server.port: 5006
      traefik.http.middlewares.actual-budget-https-redirect.redirectscheme.scheme: https
    ports:
      - ${ACTUAL_BUDGET_PORT:-5006}:5006
    volumes:
      - ${DOCKER_DATA_DIR}/actual-budget:/data
    restart: unless-stopped

networks:
  web:
    name: traefik_web
    external: true
