# - Minecraft 1.16.5 and older: Use Java 8 or 11
# - Minecraft 1.17-1.20.4: Use Java 17 or 21
# - Minecraft 1.20.5+: Use Java 21

services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: minecraft
    environment:
      EULA: "TRUE"
      TYPE: "AUTO_CURSEFORGE"
      CF_PAGE_URL: https://www.curseforge.com/minecraft/modpacks/prominence-2-hasturian-era
      CF_API_KEY: ${CURSEFORGE_API_KEY}
      INIT_MEMORY: 8G
      MAX_MEMORY: 20G
      USE_AIKAR_FLAGS: "true"
      TZ: ${TZ}
      OPS: ${MINECRAFT_OPS:-YourUsername}
      MOTD: "Willkommen auf dem Server von ${MINECRAFT_OPS}"
    labels:
      traefik.enable: true
      traefik.tcp.routers.minecraft.rule: HostSNI(`mc.${DOMAIN}`)
      traefik.tcp.routers.minecraft.entrypoints: minecraft
      traefik.tcp.routers.minecraft.service: minecraft
      traefik.tcp.services.minecraft.loadbalancer.server.port: 25565
    ports:
      - ${MINECRAFT_PORT}:25565
    volumes:
      # - "${DOCKER_DATA_DIR}/minecraft/vanilla-server:/data"
      # - "${DOCKER_DATA_DIR}/minecraft/stoneblock-4:/data"
      - "${DOCKER_DATA_DIR}/minecraft/prominence-2-hasturian-era:/data"
      - "${DOCKER_DATA_DIR}/minecraft/modpacks:/modpacks"
    tty: true
    stdin_open: true
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    name: traefik_web
    external: true
