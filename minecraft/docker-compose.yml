services:
  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft
    environment:
      EULA: "TRUE"
      TYPE: "AUTO_CURSEFORGE"
      CF_PAGE_URL: https://www.curseforge.com/minecraft/modpacks/ftb-stoneblock-4
      CF_API_KEY: ${CURSEFORGE_API_KEY}
      MEMORY: 10G
    labels:
      traefik.enable: true
      traefik.tcp.routers.minecraft.rule: HostSNI(`mc.${DOMAIN}`)
      traefik.tcp.routers.minecraft.entrypoints: tcp
    ports:
      - ${MINECRAFT_PORT}:25565
    volumes:
      - "${DOCKER_DATA_DIR}/minecraft/stoneblock-4:/data"
      - "${DOCKER_DATA_DIR}/minecraft/modpacks:/modpacks"
    tty: true
    stdin_open: true
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    name: traefik_web
    external: true

