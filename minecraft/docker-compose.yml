# - Minecraft 1.16.5 and older: Use Java 8 or 11
# - Minecraft 1.17-1.20.4: Use Java 17 or 21
# - Minecraft 1.20.5+: Use Java 21

services:
  minecraft:
    image: itzg/minecraft-server:java25
    container_name: minecraft
    environment:
      EULA: "TRUE"
      TYPE: "AUTO_CURSEFORGE"
      # CF_PAGE_URL: https://www.curseforge.com/minecraft/modpacks/prominence-2-hasturian-era
      CF_PAGE_URL: https://www.curseforge.com/minecraft/modpacks/all-the-mods-11
      CF_API_KEY: ${CURSEFORGE_API_KEY}
      INIT_MEMORY: 8G
      MAX_MEMORY: 20G
      USE_AIKAR_FLAGS: "true"
      TZ: ${TZ}
      OPS: ${MINECRAFT_OPS:-YourUsername}
      MOTD: "Willkommen auf dem Server von ${MINECRAFT_OPS}"
      ENABLE_QUERY: "true"
      QUERY_PORT: 25565
      ENABLE_AUTOPAUSE: "FALSE"
      MAX_TICK_TIME: "-1"
      # CURSEFORGE_FILES: |
      #   https://www.curseforge.com/minecraft/mc-mods/productivebees/files/8200507
      #   https://www.curseforge.com/minecraft/mc-mods/productivefarming/files/8193527
      #   https://www.curseforge.com/minecraft/mc-mods/productive-metalworks/files/8193525
    labels:
      traefik.enable: true
      traefik.tcp.routers.minecraft.rule: HostSNI(`mc.${DOMAIN}`)
      traefik.tcp.routers.minecraft.entrypoints: minecraft
      traefik.tcp.routers.minecraft.service: minecraft
      traefik.tcp.services.minecraft.loadbalancer.server.port: 25565
    ports:
      - ${MINECRAFT_PORT}:25565/tcp
      - ${MINECRAFT_PORT}:25565/udp
    volumes:
      # - "${DOCKER_DATA_DIR}/minecraft/vanilla-server:/data"
      # - "${DOCKER_DATA_DIR}/minecraft/stoneblock-4:/data"
      # - "${DOCKER_DATA_DIR}/minecraft/prominence-2-hasturian-era:/data"
      - "${DOCKER_DATA_DIR}/minecraft/all-the-mods-11:/data"
      - "${DOCKER_DATA_DIR}/minecraft/modpacks:/modpacks"
    tty: true
    stdin_open: true
    networks:
      - web
    restart: unless-stopped
  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.17
    network_mode: host
    environment:
      - SECRET_KEY=${PLAYIT_SECRET_KEY}

networks:
  web:
    name: traefik_web
    external: true
