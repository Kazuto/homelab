services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    networks:
      paperless:
    volumes:
      - ${DOCKER_DATA_DIR:-/var/lib/docker}/paperless/redis:/data

  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR:-/var/lib/docker}/paperless/postgresql:/var/lib/postgresql/data
    networks:
      paperless:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperless}

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - db
      - broker
      - proton-bridge
    labels:
      traefik.enable: true
      traefik.http.routers.paperless.rule: Host(`docs.${DOMAIN:-example.com}`)
      traefik.http.routers.paperless.entrypoints: websecure
      traefik.http.routers.paperless.tls: true
      traefik.http.routers.paperless.tls.certresolver: letsencrypt
      traefik.http.services.paperless.loadbalancer.server.port: 8000
      homepage.group: Media
      homepage.name: Paperless
      homepage.icon: paperless-ngx.png
      homepage.href: https://docs.${DOMAIN:-example.com}
      homepage.widget.type: paperlessngx
      homepage.widget.key: ${PAPERLESS_API_KEY:-key}
      homepage.widget.url: http://${LOCAL_IP:-127.0.0.1}:${PAPERLESS_PORT:-8000}
    ports:
      - ${PAPERLESS_PORT:-8000}:8000
    volumes:
      - ${DOCKER_DATA_DIR:-/var/lib/docker}/paperless/data:/usr/src/paperless/data
      - ${DOCKER_DATA_DIR:-/var/lib/docker}/paperless/media:/usr/src/paperless/media
      - /mnt/storage/documents/export:/usr/src/paperless/export
      - /mnt/storage/documents/import:/usr/src/paperless/consume
    networks:
      web:
      paperless:
    environment:
      PAPERLESS_REDIS: ${PAPERLESS_REDIS:-redis://broker:6379}
      PAPERLESS_DBHOST: ${PAPERLESS_DBHOST:-db}
      PAPERLESS_DBENGINE: ${PAPERLESS_DBENGINE:-postgresql}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-secret}
      PAPERLESS_URL: https://docs.${DOMAIN:-example.com}

  proton-bridge:
    image: dancwilliams/protonmail-bridge:latest
    ports:
      - 1025:25/tcp
      - 1143:143/tcp
    volumes:
      - ${DOCKER_DATA_DIR:-/var/lib/docker}/paperless/proton:/root
    restart: unless-stopped
    networks:
      paperless:

networks:
  web:
    name: traefik_web
    external: true
  paperless:
    name: paperless
